<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <title>Acceso administrativo · Radio & TV</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
  <section id="loginView" class="login-wrap">
    <form id="loginForm" class="login-card">
      <div class="admin-logo">RT</div>
      <small>PANEL PRIVADO</small>
      <h1>Administración</h1>
      <p>Ingresa tu contraseña de administración.</p>

      <label>
        Contraseña
        <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••">
      </label>

      <button class="primary" id="loginBtn" type="submit">Iniciar sesión</button>
      <div id="loginMsg" class="msg"></div>
      <a href="/" class="backlink">← Volver a la app</a>
    </form>
  </section>

  <script src="admin-login.js"></script>
</body>
</html>
